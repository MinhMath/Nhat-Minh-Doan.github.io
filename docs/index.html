<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papers</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#25282c;background:#fff;max-width:1100px;margin:0 auto;padding:12px 16px;line-height:1.6}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:13px 10px;border-bottom:1px solid #e7e8ea}th{font-size:13px;font-weight:500;color:#646b73}th:last-child,td:last-child{width:23%}a{color:#245c9d;text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,summary:focus-visible{outline:2px solid #245c9d;outline-offset:3px}.paper{font-size:16px}.authors,.venue{font-size:13px;color:#59616a}summary{cursor:pointer;color:#245c9d;font-size:14px;width:fit-content}ol{padding-left:17px;margin:8px 0 0;font-size:13px}li{margin:0 0 10px}.empty{color:#9a9fa5;font-size:14px}@media(max-width:600px){body{padding:4px}th,td{padding:10px 5px}.paper{font-size:14px}.authors,.venue{font-size:12px}th:last-child,td:last-child{width:21%}ol{font-size:12px}}
</style>
</head>
<body>
<table aria-label="Papers"><thead><tr><th aria-label="Paper"></th><th>Sources</th></tr></thead><tbody id="papers"></tbody></table>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=value=>{try{const url=new URL(value);return ['https:','http:'].includes(url.protocol)?url.href:'#'}catch{return '#'}};
const link=(url,label)=>'<a href="'+esc(safe(url))+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>';
const paperUrl=p=>p.doi?'https://doi.org/'+p.doi:p.arxiv?'https://arxiv.org/abs/'+p.arxiv:p.hexagon?'https://hexagonmath.org/'+p.hexagon:'#';
const sourceUrl=c=>c.url||(c.arxiv?'https://arxiv.org/abs/'+c.arxiv:c.platform==='arxiv'?'https://arxiv.org/abs/'+c.id:c.platform==='hexagon'?'https://hexagonmath.org/'+c.id:c.doi?'https://doi.org/'+c.doi:'#');
fetch('ledger.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{
 const papers=[...data.papers].sort((a,b)=>a.section===b.section?(a.section==='other'?a.display_number-b.display_number:b.display_number-a.display_number):a.section==='other'?1:-1);
 document.getElementById('papers').innerHTML=papers.map(p=>{
  const sources=data.citations.filter(c=>c.target===p.id&&c.verified);
  const details=sources.length?'<details><summary>'+sources.length+'</summary><ol>'+sources.map(c=>'<li>'+link(sourceUrl(c),c.title)+'</li>').join('')+'</ol></details>':'<span class="empty">—</span>';
  return '<tr><td><div class="paper">'+link(paperUrl(p),p.display_title||p.title)+'</div></td><td>'+details+'</td></tr>';
 }).join('');
}).catch(()=>{});
</script>
</body>
</html>
