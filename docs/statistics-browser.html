<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Marking your browser — Nhat Minh</title><style>body{font:15px/1.6 Arial,sans-serif;color:#35475c;background:#f6f8fb;max-width:500px;margin:15vh auto;padding:28px}main{background:#fff;border:1px solid #e1e7ef;border-radius:7px;padding:28px}h1{font:25px Georgia,serif}a{color:#125bc8}</style></head>
<body><main><h1>Excluding this browser</h1><p id="status">Saving the preference for your future visits and paper clicks…</p><a id="continue" href="/s">Continue to statistics</a></main>
<script>
(function(){
 try{
  localStorage.setItem('nhat-minh-doan:analytics-excluded','1');
  window.nhatMinhAnalyticsExcluded=true;
  window['ga-disable-G-0R548MHC6P']=true;
  document.getElementById('status').textContent='This browser’s future website visits, paper-link clicks, and abstract opens are excluded.';
  window.location.replace('/s?browser_excluded=1');
 }catch(error){
  document.getElementById('status').textContent='This browser blocks local storage, so the exclusion could not be saved. Allow site storage to remember it.';
 }
})();
</script></body></html>
