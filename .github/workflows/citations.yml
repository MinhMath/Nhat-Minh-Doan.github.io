name: Daily citation audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'citation_agent.py'
      - 'citation_identity.py'
      - 'test_citation_agent.py'
      - 'generate_report.py'
      - 'docs/papers.json'
      - 'docs/citing_sources.json'
      - 'requirements.txt'
      - '.github/workflows/citations.yml'
  schedule:
    # Daily at 08:23 Vietnam time (01:23 UTC).
    - cron: "23 1 * * *"
concurrency:
  group: citation-audit-v2-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Check collector syntax
        run: python -m py_compile citation_agent.py citation_identity.py generate_report.py
      - name: Run citation identity tests
        run: python -m unittest -v test_citation_agent
      - name: Refresh indexed citation candidates
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CITATION_SCAN_SECONDS: "420"
        run: python citation_agent.py
      - name: Generate GitHub-readable citation report
        if: always()
        run: python generate_report.py
      - name: Commit updated evidence
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "citation-audit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs CITATIONS.md
          git diff --cached --quiet || (git commit -m "Update citation index candidates" && git push)
      - name: Preserve audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-evidence-${{ github.run_id }}
          path: |
            docs/*.json
            CITATIONS.md

