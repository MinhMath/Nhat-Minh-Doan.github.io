name: Daily citation audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'citation_agent.py'
      - 'docs/papers.json'
      - 'requirements.txt'
      - '.github/workflows/citations.yml'
  schedule:
    # Daily at 08:23 Vietnam time (01:23 UTC).
    - cron: "23 1 * * *"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Check collector syntax
        run: python -m py_compile citation_agent.py
      - name: Refresh indexed citation candidates
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python citation_agent.py
      - name: Commit updated evidence
        run: |
          git config user.name "citation-audit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/discovered.json docs/verified.json
          git diff --cached --quiet || (git commit -m "Update citation index candidates" && git push)
